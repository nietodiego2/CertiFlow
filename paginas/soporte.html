<!DOCTYPE html>
<html lang="es-PE">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte | CertiFlow</title>
    <meta name="description" content="Centro de soporte de CertiFlow para resolver consultas sobre firma digital y gestión documental.">
    <link rel="icon" href="../imagenes/favicon.png" type="image/png">
    <link rel="stylesheet" href="../estilos/styles.css">
</head>

<body>

    <header class="header">
        <nav class="navbar">
            <a href="index.html" class="logo">
                <img src="../imagenes/logo.png" alt="Logo de CertiFlow">
            </a>

            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="servicios.html">Servicios</a></li>
                <li><a href="casosdenegocio.html">Casos de Negocio</a></li>
                <li><a href="soporte.html" class="activo">Soporte</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="hero-interno">
            <span class="etiqueta">Soporte</span>
            <h1>Centro de Soporte</h1>
            <p>Estamos listos para ayudarte en cada etapa del proceso digital.</p>
        </section>

        <section class="seccion grid-dos-columnas">
            <div>
                <img src="../imagenes/soporte.png" alt="Especialista de soporte tecnológico atendiendo consultas de clientes">
            </div>

            <form class="formulario" id="formulario-soporte">
                <h2>Enviar consulta</h2>

                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre">

                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com">

                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" placeholder="+51 987 654 321">

                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" rows="6" placeholder="Escribe tu consulta"></textarea>

                <button type="submit">Enviar Consulta</button>
                <p id="respuesta-formulario" class="mensaje"></p>
            </form>
        </section>

    </main>

    <footer class="footer">
        <p>&copy; 2026 CertiFlow</p>
        <p>Atención y acompañamiento para nuestros usuarios.</p>
    </footer>

    <script src="../js/script.js"></script>
</body>

</html>
